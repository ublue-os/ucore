name: build-ucore-disk-images
on:
  workflow_dispatch:
    inputs:
      ucore_stream:
        description: "The uCore stream: stable, testing, or lts"
        required: true
        type: string
      arch:
        description: 'JSON array of architectures to build, for example ["aarch64","x86_64"]'
        default: '["x86_64"]'
        required: false
        type: string
  workflow_call:
    inputs:
      ucore_stream:
        description: "The uCore stream: stable, testing, or lts"
        required: true
        type: string
      arch:
        description: 'JSON array of architectures to build, for example ["aarch64","x86_64"]'
        default: '["x86_64"]'
        required: false
        type: string

env:
  AKMODS_REGISTRY: ghcr.io/ublue-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.ucore_stream }}
  cancel-in-progress: true

jobs:
  # TODO: Add conditional guards
  build_image:
    name: "Build: ucore${{ matrix.image_suffix }}${{ matrix.nvidia_tag }}: ${{ matrix.arch }}"
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-26.04' || matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.arch) }}
        image_suffix:
          - "-minimal"
          - ""
          - "-hci"
        nvidia_tag:
          - ""
          - "-nvidia-lts"
          - "-nvidia"
        include:
          - image_suffix: "-minimal"
            description: An OCI image of Fedora CoreOS with a few extra tools and suitable for running in a VM
          - image_suffix: ""
            description: An OCI image of Fedora CoreOS with a few extra tools, hardware support, and storage utilities
          - image_suffix: "-hci"
            description: A hyper-converged infrastructure OCI image of Fedora CoreOS (storage + hypervisor)
    steps:
      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Install ZFS/XFS
        run: sudo apt update && sudo apt install -y zfsutils-linux xfsprogs

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Incus
        run: curl -fsSL https://pkgs.zabbly.com/get/incus-stable | sudo sh; sudo nft flush ruleset

      - name: Disable AppArmor and Allow Unprivileged User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_io_uring=0
          sudo aa-teardown
          sudo systemctl stop apparmor

      - name: Initialize Incus
        run: sudo incus admin init --auto --storage-backend=zfs

      - name: Initialize and Configure Builder
        run: |
          sudo incus init images:fedora/45 builder
          sudo incus config set builder security.privileged=true
          sudo incus config set builder security.nesting=true
          sudo incus config set builder raw.lxc=- << 'EOF'
          lxc.apparmor.profile=unconfined
          lxc.mount.auto=proc:rw sys:rw cgroup:rw
          lxc.cgroup2.devices.allow = b 7:* rwm
          lxc.cgroup2.devices.allow = c 10:229 rwm
          lxc.cgroup2.devices.allow = c 10:236 rwm
          lxc.cgroup2.devices.allow = c 10:237 rwm
          lxc.cgroup2.devices.allow = b 252:* rwm
          lxc.cgroup2.devices.allow = b 253:* rwm
          lxc.cgroup2.devices.allow = b 259:* rwm
          EOF

          sudo incus config device add builder loop-control unix-char path=/dev/loop-control
          sudo incus config device add builder mapper-control unix-char path=/dev/mapper/control

          for i in $(seq 0 7); do
            sysdev="/sys/class/block/loop$i/dev"
            node="/dev/loop$i"

            IFS=: read -r major minor < "$sysdev"
            if [ ! -e "$node" ]; then
              sudo mknod -m 0660 "$node" b "$major" "$minor"
            fi

            expected="$(printf '%x:%x' "$major" "$minor")"
            if [ ! -b "$node" ] || [ "$(stat -Lc '%t:%T' "$node")" != "$expected" ]; then
              echo "$node does not match $sysdev" >&2
              exit 1
            fi

            sudo incus config device add builder "loop$i" unix-block path="$node"
          done

          sudo incus config device add builder workspace disk source="$GITHUB_WORKSPACE" path=/ucore

          sudo incus start builder

          sleep 5
          sudo incus ls

          # Install necessary build tools and dependencies
          sudo incus exec builder -- bash << 'EOF'
          set -x
          dnf install -y \
               just git-core \
               osbuild osbuild-tools osbuild-ostree podman jq xfsprogs \
               dosfstools genisoimage squashfs-tools erofs-utils syslinux-nonlinux
          ls -la /dev/loop*
          EOF

      - name: Mark Directory as Safe for Git
        run: sudo incus exec builder -- git config --system --add safe.directory /ucore

      - name: Build Disk Images
        run: |
          sudo incus exec builder -- \
            systemd-run --unit=image-build \
            -p IOWeight=75 \
            --pty \
            --pipe \
            ionice -c 3 nice -n 19 \
            just --justfile /ucore/ucore/Justfile \
            --working-directory /ucore \
            gen-disk-images \
              "${{ inputs.ucore_stream }}" \
              "${{ matrix.image_suffix}}" \
              "${{ matrix.nvidia_tag}}"

      - name: Debug
        if: always()
        run: |
          sudo dmesg

      - name: Chown Output Directory
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE/output

      - name: List Output Directory
        run: ls -lah $GITHUB_WORKSPACE/output

      - name: Compress Disk Images
        run: |
          set -x
          for file in output/*; do
            if [ -f "$file" ]; then
              xz -z -T0 -9 -v "$file"
              sha256sum "$file.xz" > "$file.xz.sha256"
            fi
          done

      - name: Upload Metal Raw
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.xz
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.xz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Metal Raw sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.xz.sha256
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.xz.sha256
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload QEMU QCOW2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.xz
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.xz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload QEMU QCOW2 sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.xz.sha256
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.xz.sha256
          archive: false
          if-no-files-found: error
          retention-days: 1

      # - name: Upload Live ISO
      #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   with:
      #     name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live.${{ matrix.arch }}.iso.xz
      #     path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live.${{ matrix.arch }}.iso.xz
      #     archive: false
      #     if-no-files-found: error
      #     retention-days: 1

      # - name: Upload Live ISO sha256
      #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   with:
      #     name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live.${{ matrix.arch }}.iso.xz.sha256
      #     path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live.${{ matrix.arch }}.iso.xz.sha256
      #     archive: false
      #     if-no-files-found: error
      #     retention-days: 1

      # TODO: Add support for uploading with ORAS
