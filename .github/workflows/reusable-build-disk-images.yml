name: build-ucore-disk-images
on:
  workflow_dispatch:
    inputs:
      ucore_stream:
        description: "The uCore stream: stable, testing, or lts"
        required: true
        type: string
      arch:
        description: 'JSON array of architectures to build, for example ["aarch64","x86_64"]'
        default: '["x86_64"]'
        required: false
        type: string
  workflow_call:
    inputs:
      ucore_stream:
        description: "The uCore stream: stable, testing, or lts"
        required: true
        type: string
      arch:
        description: 'JSON array of architectures to build, for example ["aarch64","x86_64"]'
        default: '["x86_64"]'
        required: false
        type: string

env:
  AKMODS_REGISTRY: ghcr.io/ublue-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.ucore_stream }}
  cancel-in-progress: true

jobs:
  # TODO: Add conditional guards
  build_image:
    name: "Build: ucore${{ matrix.image_suffix }}${{ matrix.nvidia_tag }}: ${{ matrix.arch }}"
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-26.04' || matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.arch) }}
        image_suffix:
          - "-minimal"
          - ""
          - "-hci"
        nvidia_tag:
          - ""
          - "-nvidia-lts"
          - "-nvidia"
        include:
          - image_suffix: "-minimal"
            description: An OCI image of Fedora CoreOS with a few extra tools and suitable for running in a VM
          - image_suffix: ""
            description: An OCI image of Fedora CoreOS with a few extra tools, hardware support, and storage utilities
          - image_suffix: "-hci"
            description: A hyper-converged infrastructure OCI image of Fedora CoreOS (storage + hypervisor)
    steps:
      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Disable AppArmor and Allow Unprivileged User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_io_uring=0
          sudo aa-teardown
          sudo systemctl stop apparmor

      - name: Initialize and Configure Builder
        run: |
          set -x
          docker run \
                 --detach \
                 --entrypoint "tail" \
                 --name builder \
                 --network=host \
                 --pid=host \
                 --privileged \
                 --security-opt apparmor=unconfined \
                 --security-opt seccomp=unconfined \
                 --tmpfs /run:exec \
                 --tmpfs /tmp:exec \
                 --tty \
                 --volume "$GITHUB_WORKSPACE:/ucore" \
                 --volume /dev:/dev \
                 --volume /lib/modules:/lib/modules \
                 --volume /var \
                 --workdir /ucore \
                 fedora:latest \
                 "-f" "/dev/null"
            
          sleep 5

          docker exec builder dnf install -y \
               just git-core patch \
               osbuild osbuild-tools osbuild-ostree podman jq xfsprogs \
               dosfstools genisoimage squashfs-tools erofs-utils
          
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            docker exec builder dnf install -y syslinux-nonlinux
          fi

      - name: Mark Directory as Safe for Git
        run: docker exec builder git config --system --add safe.directory /ucore

      - name: Build Disk Images
        run: |
          docker exec builder \
            just --justfile /ucore/ucore/Justfile \
            --working-directory /ucore \
            gen-disk-images \
              "${{ inputs.ucore_stream }}" \
              "${{ matrix.image_suffix}}" \
              "${{ matrix.nvidia_tag}}"

      - name: Remove Builder Container
        if: always()
        run: docker rm -f builder

      - name: Chown Output Directory
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE/output

      - name: List Output Directory
        run: ls -lah $GITHUB_WORKSPACE/output

      - name: Compress Disk Images
        run: |
          set -x
          for file in output/*; do
            if [[ "$(basename "$file")" =~ \.(raw|qcow2|iso)$ ]]; then
              zstd --rm -T0 -14 -v "$file" -o "$file.zst"
              sha256sum "$file.zst" > "$file.zst.sha256"
            fi
          done

      - name: Upload Metal Raw
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.zst
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Metal Raw sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.zst.sha256
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-metal.${{ matrix.arch }}.raw.zst.sha256
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload QEMU QCOW2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.zst
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload QEMU QCOW2 sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.zst.sha256
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-qemu.${{ matrix.arch }}.qcow2.zst.sha256
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Live ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live-iso.${{ matrix.arch }}.iso.zst
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live-iso.${{ matrix.arch }}.iso.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload Live ISO sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live-iso.${{ matrix.arch }}.iso.zst.sha256
          path: output/ucore${{ matrix.image_suffix }}-${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}-live-iso.${{ matrix.arch }}.iso.zst.sha256
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Install ORAS
        uses: oras-project/setup-oras@v2.0.3
      
      - name: Install COSIGN
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.5"

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Disk Images with ORAS and Sign with COSIGN
        if: ! github.event_name == 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          pushd output
          for file in ./*.zst; do
              without_zst=${file%.*}
              file_type=${without_zst##*.}
              DISK_IMAGE_DIGEST=$(oras attach \
                --artifact-type application/vnd.$file_type.zst \
                --annotation filename="$(basename "$file")" \
                "{{ IMAGE_REGISTRY }}/ucore${{ matrix.image_suffix }}:${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}" \
                "$(basename "$file")"
            
              SHA256_DIGEST=$(oras attach \
                --artifact-type application/vnd.$file_type.zst.sha256 \
                --annotation filename="$(basename "$file")" \
                "{{ IMAGE_REGISTRY }}/ucore${{ matrix.image_suffix }}@${DISK_IMAGE_DIGEST}" \
                "$(basename "$file").sha256")

              cosign sign -y env://COSIGN_PRIVATE_KEY "{{ IMAGE_REGISTRY }}/ucore${{ matrix.image_suffix }}@${DISK_IMAGE_DIGEST}"
              cosign sign -y env://COSIGN_PRIVATE_KEY "{{ IMAGE_REGISTRY }}/ucore${{ matrix.image_suffix }}@${SHA256_DIGEST}"
          done
          popd
          
          oras discover --format json "{{ IMAGE_REGISTRY }}/ucore${{ matrix.image_suffix }}:${{ inputs.ucore_stream }}${{ matrix.nvidia_tag }}"